# Qodo AI Code Suggestions v3.9.2
# Inline code suggestions only — the highest-value, lowest-noise output.
# All config lives in webuildstuffio/pr-agent-settings/.pr_agent.toml (global)
# and per-repo .pr_agent.toml (overrides). This workflow is intentionally minimal.
#
# Model: repo-variable driven - QODO_MODEL + QODO_FALLBACK_1..3.
# Fleet rollout 2026-10-23: Nemotron 3 Ultra 550B (free) primary;
# fallbacks gemma-4-31b-it, gemma-4-26b-a4b-it, openrouter/free
# (last resort). The value after || is the built-in default used
# when the variable is unset; it matches the QODO_* repo variables.
# retries 1, ai_timeout 180s per call, no same-model retry on timeout.
# API: direct OpenRouter (no AI Gateway proxy — CF gateway corrupts streaming).
# DO NOT use openrouter/free as primary — proven broken (silent no-reviews).
# NOTE (v3.9.0): the two composite actions live in the PUBLIC
# webuildstuffio/pr-agent-actions repo (a public consumer can
# never resolve an action from a private repo, and no token can
# be passed for action resolution). The tuned .pr_agent.toml
# ships as the PRIVATE ghcr.io/webuildstuffio/pr-agent-config
# package, published by pr-agent-settings; the qodo-config
# action pulls it with this job's GITHUB_TOKEN and the
# config.extra_config_url contract is unchanged. A repo on
# this wiring therefore needs a one-time "Manage Actions
# access" grant on that package and packages: read below.
# pr-agent-settings must stay PUBLIC only until a repo moves
# to this wiring: on the old wiring the default GITHUB_TOKEN
# cannot read it as a private repo (404), which silently drops
# all global tuning (temperature, score threshold, focus
# instructions). The global_settings_repo env remains set as a
# fallback layer, unchanged.
# /review and /describe available via manual /command in PR comments.
#
# CHANGELOG:
# v3.9.2: (Nov 11 2026) Jev repinned to jev-tag v2.2.0 /
#          jev-action v1.1.0 in pr-agent-actions (package
#          merged as pr-agent-settings#55, ported verbatim
#          in pr-agent-actions#1; this pin is that merge
#          commit). Decision logic only: bounded retry with
#          abstain-and-flag on model-call exhaustion,
#          docs-only gate plus hard-negative criteria,
#          Layer 1 route refinement, a dedicated
#          diff-enriched security call with escalation
#          concurrence, and the standalone Codex comment
#          on escalation. Qodo side unchanged.
# v3.9.0: (Nov 8 2026) Privacy split (pr-agent-settings #18):
#          qodo-config and jev move to the new public
#          webuildstuffio/pr-agent-actions repo at a pinned
#          full SHA, and qodo-config v2 pulls the global config
#          from the private pr-agent-config package (published
#          by pr-agent-settings) with the job GITHUB_TOKEN
#          instead of copying a toml bundled in the action
#          archive. The suggest job gains packages: read for
#          the pull. Same extra_config_url path, same failure
#          checks, same precedence; repos on this wiring no
#          longer need pr-agent-settings to be public.
# v3.8.2: (Nov 6 2026) Twin dedup (architecture audit #176):
#          the "Set PR for manual runs" step in the suggest
#          job now passes pr_number via env like the jev job
#          (no input interpolated into the script), making
#          the two steps byte-identical; the Qodo config and
#          Jev failure-check steps share one script body, with
#          check name, title and summary passed via env.
#          scripts/tests/check-workflow-drift.sh (Shell CI)
#          fails if either pair diverges. Companion change:
#          claude.yml v5.28.20.
# v3.8.1: (Nov 6 2026) Full-SHA pinning for first-party
#          actions (repo-review #696, owner-approved): every
#          version-tag pin moves to its full 40-char SHA
#          with the version kept as a trailing comment.
#          Canonical pass with claude.yml v5.28.19.
# v3.8.0: (Nov 6 2026) Skip the review jobs on docs-only
#          PRs (repo-review #686): a changes job runs the
#          fleet dorny/paths-filter pattern (job-level,
#          never workflow-level paths:) and suggest + jev
#          run only when it reports a code change, or
#          when it was skipped or failed (non-PR events,
#          filter errors: fail open, the review runs).
#          Docs-only PRs get no Qodo suggestions and no
#          Jev pass, saving about 3 billed min per
#          docs-only PR opening. The same wave's cache
#          removal (repo-review #687) landed in v3.7.1.
# v3.7.1: (Nov 6 2026) Remove the dead Docker cache step
#          (repo-review #687). The workflow's triggers
#          (pull_request, issue_comment, workflow_dispatch)
#          never produced a single qodo-docker cache entry
#          in any sampled fleet repo, and /var/lib/docker is
#          not a portable cache path on ephemeral runners:
#          the step only pretended to cache. No replacement;
#          the pr-agent image pull is the honest cost.
# v3.6.1: (Nov 4 2026) Jev repackaged as a composite action and
#          moved into its own "Jev tagging" job. Loading is now
#          uses: webuildstuffio/pr-agent-settings/jev at a pinned
#          full SHA with the job GITHUB_TOKEN under that repo's
#          organization Actions access (jev-action v1.0.0,
#          pr-agent-settings#42), replacing the raw.githubusercontent
#          curl + SHA256 load that 404ed silently once
#          pr-agent-settings went private (fleet outage 2026-11-01
#          to 2026-11-04). The job split matters: a uses: reference
#          resolves when its job is prepared, so as a step inside
#          suggest an unresolvable pin failed the whole suggest job
#          before Qodo ran (probe folio-app#3233). As its own job,
#          a load failure fails only that job and surfaces as a
#          failed "Jev tagging" check on the PR; a step-level
#          failure posts the same check via the API. Same jev-tag
#          v2.1.0 logic and env contract; the job is
#          continue-on-error and never gates a merge.
# v3.5.1: (Oct 28 2026) Gate the issue_comment trigger on the comment
#          author's association (OWNER / MEMBER / COLLABORATOR) so only
#          trusted commenters can trigger paid-model runs via /improve,
#          /review or /describe (repo-review#387; owner decision
#          2026-10-24: GATE IT). pull_request and workflow_dispatch
#          branches unchanged.
# v3.5.0: (Oct 26 2026) Fleet sync (repo-review#399): pin the pr-agent
#          runtime image by the v0.48.0 Docker Hub digest (as repo-review
#          #430) instead of inheriting the rolling action wrapper; version
#          the Docker cache key; raise config.ai_timeout 90 -> 180 and set
#          config.retry_same_model_on_timeout=false so a slow Nemotron
#          call fails over to the Gemma fallbacks instead of retrying it;
#          job timeout-minutes 8 -> 15: one run makes several tool
#          calls, each with its own fallback chain, and at 180s a call
#          the old cap could kill the job mid-run on a slow day.
# v3.3.2: (Oct 26 2026) Fix: pr-agent v0.48 turns namespace-wide settings
#          off by default; set config.global_settings_repo in the step env
#          so webuildstuffio/pr-agent-settings keeps applying (#102).
# v3.3.1: (Sep 30 2026) Fix: issue_comment events cancelled in-progress PR reviews
#          via shared concurrency group. Root cause: GH Actions evaluates concurrency
#          BEFORE job-level 'if:', so any bot comment entering the same group killed
#          the running /improve job. Fix: include event_name in group key.
# v3.3.0: (Sep 30 2026) Concurrency groups, improved caching, permission polish.
# v3.2.1: (Sep 29 2026) Bypass CF AI Gateway — route directly to OpenRouter.
# v3.2.0: (Sep 29 2026) gemma-4-31b primary + 8-model :free fallback chain.

name: Qodo AI Code Suggestions

"on":
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (empty = latest open PR)"
        required: false
        type: string

concurrency:
  group: qodo-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # 'some-with-excludes' makes the negations below effective
          # (default 'some' lets the leading '**' win). Fail open:
          # if this job fails or is skipped (non-PR events), the
          # review jobs below still run.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!README*'
              - '!CHANGELOG*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE*'

  suggest:
    needs: changes
    if: >-
      ${{
        always() &&
        (needs.changes.result == 'skipped' || needs.changes.result == 'failure' || needs.changes.outputs.code == 'true') &&
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'dependabot/')
        ) ||
        (github.event_name == 'workflow_dispatch') ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          ) &&
          (
            contains(github.event.comment.body, '/improve') ||
            contains(github.event.comment.body, '/review') ||
            contains(github.event.comment.body, '/describe')
          )
        )
      }}
    runs-on: ${{ vars.CI_RUNNER || 'ubicloud-standard-2' }}
    # 15, not 8 (v3.5): a run makes several pr-agent tool calls, each
    # with its own fallback chain at ai_timeout 180s; the old cap could
    # kill the job mid-run on a slow day. The cap only binds in that
    # pathological case - typical runs are ~2-4min.
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      checks: write
      issues: write
      pull-requests: write
      contents: read
      # v3.9.0: the qodo-config action pulls the pr-agent-config
      # package with this job's token.
      packages: read
    name: Code Suggestions (free models)
    steps:
      # Twin of the "Set PR for manual runs" step in the jev job
      # below: the two blocks are byte-identical on purpose (the
      # input arrives via env, never interpolated into the script);
      # scripts/tests/check-workflow-drift.sh fails if they diverge.
      - name: Set PR for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            const n = process.env.PR_NUMBER ?? '';
            if (n) { core.exportVariable('TARGET_PR', n); return; }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', sort: 'updated', direction: 'desc', per_page: 1
            });
            if (prs.length) { core.exportVariable('TARGET_PR', prs[0].number); }
            else { core.setFailed('No open PRs'); }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Qodo model variables
        env:
          QODO_MODEL: >-
            ${{ vars.QODO_MODEL ||
            'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' }}
          QODO_FALLBACK_1: >-
            ${{ vars.QODO_FALLBACK_1 ||
            'openrouter/google/gemma-4-31b-it:free' }}
          QODO_FALLBACK_2: >-
            ${{ vars.QODO_FALLBACK_2 ||
            'openrouter/google/gemma-4-26b-a4b-it:free' }}
          QODO_FALLBACK_3: "${{ vars.QODO_FALLBACK_3 || 'openrouter/free' }}"
        run: |
          fail=0
          check_var() {
            name="$1"; value="$2"
            case "$value" in
              openrouter/*) ;;
              *)
                echo "::error::$name must start with openrouter/ (got: $value)"
                fail=1 ;;
            esac
            case "$value" in
              *[\"\,\[\]]* | *\\* | *[[:space:]]*)
                echo "::error::$name has forbidden characters (got: $value)"
                fail=1 ;;
            esac
          }
          check_var QODO_MODEL "$QODO_MODEL"
          check_var QODO_FALLBACK_1 "$QODO_FALLBACK_1"
          check_var QODO_FALLBACK_2 "$QODO_FALLBACK_2"
          check_var QODO_FALLBACK_3 "$QODO_FALLBACK_3"
          exit "$fail"

      # Global Qodo config (wiring v3.9.0): pr-agent's own
      # global_settings_repo fetch reads pr-agent-settings through
      # the API with this job's GITHUB_TOKEN, which 404s while that
      # repo is private, silently dropping all global tuning not
      # duplicated in the env block below. This action (in the
      # public pr-agent-actions repo, the same uses: transport as
      # the Jev action) pulls the global .pr_agent.toml from the
      # private pr-agent-config package with this job's token and
      # extracts it into the workspace; the pr-agent step loads
      # it via config.extra_config_url. Precedence in pr-agent:
      # extra config < per-repo .pr_agent.toml < env block, so
      # local overrides still win.
      - name: Global Qodo config
        id: qodo_config
        continue-on-error: true
        uses: webuildstuffio/pr-agent-actions/qodo-config@f8f04c6e1d0aafe4047ea251ab423d20490930c4

      # Failure visibility: if the config action failed to run,
      # post a FAILED "Qodo global config" check on the PR head
      # SHA. The suggestions step still runs (on upstream
      # defaults), so a config outage degrades visibly instead of
      # silently. A load failure of the action reference itself
      # fails this job at preparation, which likewise surfaces as
      # a failed job check rather than a silent pass.
      # The script body is shared with the Jev failure check in
      # the jev job (check name, title and summary arrive via
      # env); scripts/tests/check-workflow-drift.sh fails if the
      # two bodies diverge.
      - name: Qodo config failure check
        if: >-
          !cancelled() && steps.qodo_config.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FAILURE_CHECK_NAME: 'Qodo global config'
          FAILURE_CHECK_TITLE: 'Qodo global config failed to load'
          FAILURE_CHECK_SUMMARY: >-
            The Global Qodo config step failed, so pr-agent ran without the
            org-global .pr_agent.toml (upstream defaults only). See the
            "Global Qodo config" step log in the Code Suggestions job of
            this workflow run.
        with:
          script: |
            const fromEvent = context.payload.pull_request;
            const prNumber = fromEvent?.number ?? context.payload.issue?.number ?? Number(process.env.TARGET_PR || 0);
            let headSha = fromEvent?.head?.sha ?? '';
            if (!headSha && prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: prNumber
              });
              headSha = pr.head.sha;
            }
            if (!headSha) {
              core.warning(`${process.env.FAILURE_CHECK_NAME} check: the guarded step failed but no PR head SHA is available; no check posted.`);
              return;
            }
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: process.env.FAILURE_CHECK_NAME,
              head_sha: headSha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: process.env.FAILURE_CHECK_TITLE,
                summary: process.env.FAILURE_CHECK_SUMMARY
              }
            });

      - name: Run Qodo /improve
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d # v0.48.0-github_action
        env:
          OPENROUTER__KEY: ${{ secrets.QODO_OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.global_settings_repo: "pr-agent-settings"
          config.extra_config_url: "/github/workspace/.pr_agent.global.toml"
          config.model: >-
            ${{ vars.QODO_MODEL ||
            'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' }}
          config.fallback_models: >-
            ["${{ vars.QODO_FALLBACK_1 || 'openrouter/google/gemma-4-31b-it:free' }}",
            "${{ vars.QODO_FALLBACK_2 || 'openrouter/google/gemma-4-26b-a4b-it:free' }}",
            "${{ vars.QODO_FALLBACK_3 || 'openrouter/free' }}"]
          config.num_retries: "1"
          config.retry_same_model_on_timeout: "false"
          config.ai_timeout: "180"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "131072"
          github_action_config.auto_improve: "true"
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
  # Jev tagging (jev-tag v2.2.0 / jev-action v1.1.0): Layer 1
  # rules + one Jev Decisions API request label the PR and its
  # linked issue, and request a Codex security review when the
  # band fires. Its own job since v3.6.1, never a step inside
  # suggest: a uses: reference is resolved when its job is
  # prepared, before any step runs, so a Jev load failure can
  # only ever fail this job, never the suggestions.
  jev:
    needs: changes
    if: >-
      ${{
        always() &&
        (needs.changes.result == 'skipped' || needs.changes.result == 'failure' || needs.changes.outputs.code == 'true') &&
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'dependabot/')
        ) ||
        (github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
      checks: write
    name: Jev tagging
    steps:
      # Twin of the "Set PR for manual runs" step in the suggest job
      # above: the two blocks are byte-identical on purpose (the
      # input arrives via env, never interpolated into the script);
      # scripts/tests/check-workflow-drift.sh fails if they diverge.
      - name: Set PR for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            const n = process.env.PR_NUMBER ?? '';
            if (n) { core.exportVariable('TARGET_PR', n); return; }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', sort: 'updated', direction: 'desc', per_page: 1
            });
            if (prs.length) { core.exportVariable('TARGET_PR', prs[0].number); }
            else { core.setFailed('No open PRs'); }

      - name: Tag PR
        id: jev
        uses: webuildstuffio/pr-agent-actions/jev@abc1be22be431c86754520050880ef071b3d852a
        with:
          pr-number: ${{ github.event.pull_request.number }}
          mode: ${{ vars.JEV_TAG_MODE || 'apply' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openrouter-api-key: ${{ secrets.QODO_OPENROUTER_API_KEY }}
          mention-pat: ${{ secrets.JEV_MENTION_PAT }}

      # Failure visibility: a step-level failure posts a FAILED
      # "Jev tagging" check on the PR head SHA. A load failure
      # never reaches this step: it fails the job at preparation,
      # which itself surfaces as the failed "Jev tagging" job
      # check. Model-call failures do not land here either:
      # jev_tag fails open internally and still posts its
      # degraded sticky.
      # The script body is shared with the Qodo config failure
      # check in the suggest job (check name, title and summary
      # arrive via env); scripts/tests/check-workflow-drift.sh
      # fails if the two bodies diverge.
      - name: Jev failure check
        if: >-
          !cancelled() && steps.jev.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FAILURE_CHECK_NAME: 'Jev tagging'
          FAILURE_CHECK_TITLE: 'Jev tagging failed to run'
          FAILURE_CHECK_SUMMARY: >-
            The Jev tagging step failed before completing, so this PR has
            no Jev labels and no Codex security trigger. See the "Tag PR"
            step log in the Jev tagging job of this workflow run.
        with:
          script: |
            const fromEvent = context.payload.pull_request;
            const prNumber = fromEvent?.number ?? context.payload.issue?.number ?? Number(process.env.TARGET_PR || 0);
            let headSha = fromEvent?.head?.sha ?? '';
            if (!headSha && prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: prNumber
              });
              headSha = pr.head.sha;
            }
            if (!headSha) {
              core.warning(`${process.env.FAILURE_CHECK_NAME} check: the guarded step failed but no PR head SHA is available; no check posted.`);
              return;
            }
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: process.env.FAILURE_CHECK_NAME,
              head_sha: headSha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: process.env.FAILURE_CHECK_TITLE,
                summary: process.env.FAILURE_CHECK_SUMMARY
              }
            });
